# Self-Service Claim generated by the Corporate Service Catalog
# Committed via GitOps PR -> Validated by CI Policy Gate -> Synced by ArgoCD
apiVersion: platform.corp.internal/v1alpha1
kind: GenAIBoxClaim
metadata:
  name: clinical-trial-matcher
  labels:
    business-unit: healthcare-clinical-research
    managed-by: backstage-service-catalog
spec:
  intent: "Connect an LLM agent to structured patient records and match free-text clinical trials."
  dataClassification: restricted-phi-gdpr   # Enforces Zero-Egress + Local Embeddings + MCP Gateway
  finops:
    tShirtSize: small-cpu                   # Enforces Kubernetes ResourceQuota (8 vCPU / 15Gi RAM)
    predictableMonthlyCostEUR: 140
    variableTokenCostEUR: 0.00
  stack:
    llmModel: gemma4:e2b
    embeddingModel: nomic-embed-text        # 768-dim local semantic vectors
    mcpGateway: mcp-toolbox-read-only       # Routes strictly to pg-sovereign-ro:5432
    database:
      operator: cloudnative-pg-1.28
      engine: postgresql-18-standard-trixie
      vectorIndex: hnsw-cosine-768
      instances: 2                          # 1 Primary (-rw) + 1 Read Replica (-ro)
      qosClass: Guaranteed                  # Prevents Linux OOMKiller eviction
