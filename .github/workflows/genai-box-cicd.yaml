name: "GenAI in a Box — CI/CD Policy Gate & GitOps Delivery"

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "catalog/**"
      - "k8s/**"
      - "src/**"
      - "gitops/**"

jobs:
  platform-policy-gate:
    name: "1. Platform Policy-as-Code Gate (FinOps, Security & DB SRE)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run Corporate Guardrail Linter (FinOps Quota, Zero-Trust NetworkPolicy, PG18 QoS)
        run: python3 catalog/policy_gate.py

      - name: Validate Synthetic Clinical Dataset Generator
        run: python3 src/generate_data.py

  build-and-gitops-sync:
    name: "2. Build ADK Agent & Trigger ArgoCD GitOps Sync"
    needs: platform-policy-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Kustomize Overlay
        run: kubectl kustomize k8s/ > /dev/null

      - name: ArgoCD Declarative Application Sync Check
        run: |
          echo "Verified gitops/argocd-genai-box-app.yaml ready for cluster reconciliation."
